[package]
name = "fresco"
version = "1.1.40"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Live wallpapers for Linux — video, GIF, image, slideshow, and playlist wallpapers with hardware-accelerated playback"
repository = "https://github.com/DibbayajyotiRoy/fresco"
authors = ["Dibbayajyoti Roy"]

[features]
default = ["gui", "daemon"]
gui = ["dep:gtk4", "dep:libadwaita", "dep:ureq", "dep:async-channel", "dep:semver"]
daemon = [
    "dep:x11rb", "dep:libloading", "dep:nix", "dep:wayland-client",
    "dep:wayland-protocols-wlr", "dep:cosmic-protocols",
    # Event-driven push: the daemon subscribes to Supabase Realtime over a
    # blocking websocket and raises native desktop notifications.
    "dep:ureq", "dep:tungstenite", "dep:notify-rust", "dep:semver",
    # Album-art widget: decode cover art to RGBA for mpv's `overlay-add`.
    "dep:image",
    # widgetkit: the 2D rasteriser behind the bitmap widgets (see src/widgetkit).
    "dep:tiny-skia", "dep:cosmic-text",
]

[[bin]]
name = "fresco"
path = "src/bin/fresco.rs"
required-features = ["gui"]

[[bin]]
name = "frescod"
path = "src/bin/frescod.rs"
required-features = ["daemon"]


[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
# Local wall-clock handling for scheduled wallpapers (std has no local tz).
# Non-optional: the schedule engine is shared core (daemon evaluates, GUI edits).
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs = "6"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
gtk4 = { version = "0.9", features = ["v4_6"], optional = true }
libadwaita = { version = "0.7", features = ["v1_1"], optional = true }
x11rb = { version = "0.13", features = ["randr", "shape"], optional = true }
libloading = { version = "0.8", optional = true }
nix = { version = "0.29", features = ["process", "signal", "fs"], optional = true }
wayland-client = { version = "0.31", optional = true }
# wlr-foreign-toplevel-management: lets the daemon see fullscreen state per output
# so it can pause that output's wallpaper (wlroots/KDE; GNOME doesn't implement it).
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
# zcosmic-toplevel-info: COSMIC's native equivalent (its compositor lacks the wlr
# protocol), used as a fallback so fullscreen auto-pause works on COSMIC too.
cosmic-protocols = { version = "0.2", default-features = false, features = ["client"], optional = true }
ureq = { version = "2", features = ["json"], optional = true }
async-channel = { version = "2", optional = true }
# Daemon-side event-driven notifications (Supabase Realtime + desktop notifs).
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"], optional = true }
notify-rust = { version = "4", optional = true }
semver = { version = "1", optional = true }
# Cover-art decode for the album-art widget. Only the formats MPRIS players
# actually serve as artwork — no TIFF/EXR/etc, which keeps the build small.
# Audio capture needs no crate (we read PCM from `parec`/`pw-cat`, the same
# shell-out approach dde.rs uses for D-Bus) and the FFT is our own, so this is
# the single dependency the visualiser/disc widgets add.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
# --- widgetkit: the pure-Rust 2D stack for bitmap widgets -------------------
# Both are pure Rust with no C or system libraries, which is the hard
# constraint: Fresco already bundles mpvpaper because its dependency wasn't
# packaged, and we are not repeating that. See src/widgetkit/mod.rs for the
# full rationale, including why cosmic-text won over fontdue/ab_glyph.
tiny-skia = { version = "0.12", optional = true }
cosmic-text = { version = "0.19", optional = true }

[profile.release]
opt-level = 3
lto = "fat"          # whole-program optimization across crates
codegen-units = 1    # best optimization (slower compile, smaller/faster binary)
panic = "abort"      # drop unwinding tables: smaller binary, and safer across the GTK/mpv FFI boundary
strip = true

[package.metadata.deb]
maintainer = "Dibbayajyoti Roy <maromaromuje28@gmail.com>"
copyright = "2026, Dibbayajyoti Roy"
section = "video"
priority = "optional"
# All of these exist in Debian/Ubuntu/Pop!_OS/Mint repos. mpvpaper itself is NOT
# in the repos, so we BUNDLE its binary (see assets → usr/lib/fresco/mpvpaper)
# and only depend on the shared libraries it links at runtime.
# libglib2.0-bin is a HARD dependency because it owns two binaries the app
# shells out to and cannot work without (verified: `dpkg -S $(which gdbus)`):
#   * `gsettings` — the ONLY way Fresco paints a wallpaper on GNOME Wayland
#     (src/daemon/overview.rs; Mutter has no live-wallpaper surface, so the
#     static frame is the whole backend there). Without it `gnome_available()`
#     is false and a GNOME Wayland user gets no wallpaper at all.
#   * `gdbus` — every MPRIS query in src/mpris.rs and src/daemon/widgets.rs,
#     i.e. all of the 1.1.36 lyrics / album-art / track-synced widgets, plus
#     the DDE background calls in src/daemon/dde.rs.
# libgtk-4-1 pulls libglib2.0-0, NOT libglib2.0-bin, so a minimal desktop or a
# container genuinely may not have it — transitive presence is not a guarantee.
depends = "libgtk-4-1 (>= 4.6), libadwaita-1-0 (>= 1.1), libmpv2 | libmpv1, libwayland-client0, libwayland-egl1, libegl1, libgl1, ffmpegthumbnailer, libglib2.0-bin"
# Recommends, not Depends: every one of these powers a feature that degrades to
# a logged, actionable message rather than breaking the app.
#   * pulseaudio-utils | pipewire-bin — `parec` / `pw-cat` for the audio
#     visualiser widget (src/audio_capture.rs). Opt-in and off by default, and
#     src/daemon/widgets.rs::open_capture already logs which package to install,
#     so this must not be a hard dependency. pulseaudio-utils leads because it
#     is the smaller, daemon-free package and pipewire-pulse serves `parec`
#     too; on a PipeWire box pipewire-bin is already installed, which satisfies
#     the alternative and pulls nothing extra.
#   * xdg-utils — `xdg-open` for the help/tutorial/notification links.
#   * pkexec | policykit-1 — the in-app updater's privilege prompt. The package
#     that owns /usr/bin/pkexec was renamed: `pkexec` on Debian 12 / Ubuntu
#     24.04+, `policykit-1` on Debian 11 / Ubuntu 22.04.
#   * ffmpeg — `ffmpeg` for rotated thumbnails/overview frames (falls back to
#     ffmpegthumbnailer unrotated) and `ffprobe` for library metadata (fields
#     just stay empty). Both already degrade silently by design.
recommends = "mesa-va-drivers, intel-media-va-driver, fonts-inter, gstreamer1.0-plugins-good, gstreamer1.0-libav, ffmpeg, pulseaudio-utils | pipewire-bin, xdg-utils, pkexec | policykit-1"
extended-description = """\
Fresco sets videos, GIFs, images, slideshows, and video playlists as your \
desktop wallpaper. Pick media in a simple app, click Set, close the app — \
the wallpaper keeps playing and restores on login. Hardware-accelerated \
decoding keeps CPU usage near zero without degrading quality."""
assets = [
    ["target/release/fresco", "usr/bin/", "755"],
    ["target/release/frescod", "usr/bin/", "755"],
    # Bundled Wayland renderer, one build per libmpv soname generation: the
    # "libmpv1" build (ubuntu-22.04 CI) for older LTS bases and the "libmpv2"
    # build (ubuntu-24.04 CI) for current distros. NOT in /usr/bin (so they
    # can't collide with a user-installed mpvpaper); frescod probes which one
    # actually loads via mpvpaper_command(). Built by scripts/build-mpvpaper.sh
    # in _release.yml before `cargo deb`.
    ["target/release/mpvpaper-libmpv1", "usr/lib/fresco/mpvpaper-libmpv1", "755"],
    ["target/release/mpvpaper-libmpv2", "usr/lib/fresco/mpvpaper-libmpv2", "755"],
    # Auto-updater run by frescod via pkexec when a newer release is published.
    ["scripts/fresco-update.sh", "usr/lib/fresco/fresco-update.sh", "755"],
    ["data/io.github.dibbayajyotiroy.Fresco.desktop", "usr/share/applications/", "644"],
    ["data/icons/io.github.dibbayajyotiroy.Fresco.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    # Fixed-size PNGs: some icon themes (e.g. Deepin 25's "bloom") never look in
    # scalable/, so ship raster fallbacks that hicolor inheritance always finds.
    ["data/icons/hicolor/48x48/apps/io.github.dibbayajyotiroy.Fresco.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["data/icons/hicolor/64x64/apps/io.github.dibbayajyotiroy.Fresco.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["data/icons/hicolor/128x128/apps/io.github.dibbayajyotiroy.Fresco.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["data/icons/hicolor/256x256/apps/io.github.dibbayajyotiroy.Fresco.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["data/icons/hicolor/512x512/apps/io.github.dibbayajyotiroy.Fresco.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    # Deepin/DDE-only icon variant. Same icon name, installed into Deepin's
    # "bloom" theme, so ONLY a DDE session resolves it — every other desktop
    # keeps the hicolor artwork above. It is drawn to bloom's conventions
    # (full-bleed squircle, single frame) so Fresco doesn't look foreign in the
    # Deepin launcher.
    #
    # This is a LOOK change, not a fix: shipping icons into bloom was tried as a
    # fix for the launcher not showing Fresco until `killall dde-shell` and was
    # disproved — with bloom SVGs installed AND a generated .dci, GtkIconTheme
    # resolves our icon in bloom, hicolor and Papirus and the launcher still
    # skips us. See docs/AUDIT.md "Deepin launcher hot refresh".
    ["data/icons/bloom/io.github.dibbayajyotiroy.Fresco.svg", "usr/share/icons/bloom/apps/48/", "644"],
    ["data/icons/bloom/io.github.dibbayajyotiroy.Fresco.svg", "usr/share/icons/bloom/apps/128/", "644"],
    ["data/icons/bloom/io.github.dibbayajyotiroy.Fresco.svg", "usr/share/icons/bloom/apps/256/", "644"],
    ["data/icons/bloom/io.github.dibbayajyotiroy.Fresco.svg", "usr/share/icons/bloom/apps/512/", "644"],
]
# The postinst NEVER refreshes the icon cache or desktop database: the standard
# hicolor-icon-theme and desktop-file-utils triggers own that (they fire when our
# files land in their watched dirs), exactly like a plain debhelper GUI package.
# Duplicating that work is what 1.1.34 removed. All the postinst does is
# re-announce our .desktop file on Deepin, after dpkg's triggers finish — see the
# script and docs/AUDIT.md "Deepin launcher hot refresh".
maintainer-scripts = "packaging/debian"
